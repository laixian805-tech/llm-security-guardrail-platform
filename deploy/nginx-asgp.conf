# ASGP 控制台对外入口。
# 控制面只绑 127.0.0.1:8010（管理面不直接暴露），对外一律经 nginx。
# 8000 只做 301 跳转，443 提供 TLS；端侧隧道直连 127.0.0.1:8010，不经过这里。
server {
    listen 8000;
    server_name _;

    # 只做跳转。8000 曾是明文入口，继续提供 HTTP 会让"上了 HTTPS"变成空话——
    # 用户拿到旧链接照样走明文。端侧隧道直接连 127.0.0.1:8010，不经过这里。
    return 301 https://$host$request_uri;
}

# HTTPS 入口。
# Let's Encrypt 走不通：腾讯云把未备案域名的 80 请求拦到备案提示页，HTTP-01
# 验证取不到文件。IP 直连不受备案拦截，所以用自签证书 + IP 访问——代价是
# 浏览器首次会警告"证书不受信任"，但传输已经加密，密码不再明文。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 43.139.77.64 43-139-77-64.nip.io;

    ssl_certificate     /etc/nginx/ssl/asgp.crt;
    ssl_certificate_key /etc/nginx/ssl/asgp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:asgp:10m;
    ssl_session_timeout 1h;

    client_max_body_size 32m;

    location = /api/session {
        limit_req zone=asgp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
